name: image-set-production

x-app-build: &app-build
  context: .
  dockerfile: infra/docker/Dockerfile
  args:
    APP_NAME: '@image-set/web'
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}

x-app-environment: &app-environment
  NODE_ENV: production
  DEPLOYMENT_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Set S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
  OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-6.1-sol}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
  OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-6-luna}

x-service-defaults: &service-defaults
  image: ${APP_IMAGE:-image-set-app:production}
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'
  networks:
    - backend

services:
  web:
    <<: *service-defaults
    build: *app-build
    command: ['pnpm', '--filter', '@image-set/web', 'start']
    environment:
      <<: *app-environment
      API_INTERNAL_URL: http://api:3001/api
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  api:
    <<: *service-defaults
    build: *app-build
    command: ['pnpm', '--filter', '@image-set/api', 'start']
    environment:
      <<: *app-environment
      API_PORT: 3001
      WEB_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      COOKIE_SECURE: 'true'
      TRUST_PROXY_HOPS: 1
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-900}
      RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-30}
      RATE_LIMIT_UPLOAD_WINDOW_SECONDS: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:-3600}
      RATE_LIMIT_ANALYSIS_MAX: ${RATE_LIMIT_ANALYSIS_MAX:-10}
      RATE_LIMIT_ANALYSIS_WINDOW_SECONDS: ${RATE_LIMIT_ANALYSIS_WINDOW_SECONDS:-3600}
      RATE_LIMIT_GENERATION_MAX: ${RATE_LIMIT_GENERATION_MAX:-30}
      RATE_LIMIT_GENERATION_WINDOW_SECONDS: ${RATE_LIMIT_GENERATION_WINDOW_SECONDS:-3600}
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    <<: *service-defaults
    build: *app-build
    command: ['pnpm', '--filter', '@image-set/worker', 'start']
    environment:
      <<: *app-environment
      WORKER_HEALTH_PORT: 3002
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 45s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR}:/etc/nginx/tls:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://localhost/healthz',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
      - edge
      - backend

networks:
  edge:
  backend:
    internal: true
